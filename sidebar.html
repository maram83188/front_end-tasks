<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Collapsible Sidebar</title>
<style>
:root{--bg:#fff8e6;--ink:#111;--side:#111;--side-ink:#fff;--accent:#f7b500;--muted:#555;--w:240px;--w-c:68px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1608;--ink:#f5efe0;--side:#000;--muted:#b9b095}}
:root[data-theme="dark"]{--bg:#1a1608;--ink:#f5efe0;--side:#000;--muted:#b9b095}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;display:flex}
.sidebar{width:var(--w);background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;padding:14px 10px;gap:6px;transition:width .3s ease;overflow:hidden;flex-shrink:0}
.sidebar.closed{width:var(--w-c)}
.top{display:flex;align-items:center;gap:10px;height:48px;padding:0 6px}
.logo{width:36px;height:36px;border-radius:50%;background:var(--accent);color:#111;display:grid;place-items:center;font-weight:700;flex-shrink:0}
.label{white-space:nowrap;transition:opacity .2s ease}
.closed .label{opacity:0;pointer-events:none}
nav{display:flex;flex-direction:column;gap:4px;margin-top:14px}
nav a{display:flex;align-items:center;gap:14px;padding:12px 14px;color:inherit;text-decoration:none;border-radius:10px;font-family:system-ui,sans-serif;font-size:15px}
nav a:hover,nav a:focus-visible{background:#2a2a2a;outline:none}
nav a.active{background:var(--accent);color:#111}
nav svg{width:22px;height:22px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
main{flex:1;padding:20px 24px;min-width:0}
#toggle{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--ink);background:var(--accent);color:#111;font:600 15px system-ui,sans-serif;padding:10px 16px;border-radius:10px;cursor:pointer}
#toggle:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
h1{font-size:clamp(28px,5vw,44px);margin:28px 0 8px}
p{max-width:60ch;line-height:1.6;color:var(--muted)}
@media (max-width:600px){
 .sidebar{position:fixed;inset:0 auto 0 0;z-index:5;padding-top:calc(14px + env(safe-area-inset-top,0px))}
 .sidebar.closed{width:0;padding:14px 0}
 main{padding-left:16px}
 body.open-m::after{content:"";position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:4}
}
@media (prefers-reduced-motion:reduce){.sidebar,.label{transition:none}}
</style>
</head>
<body>
<aside class="sidebar" id="sidebar" aria-label="Sidebar">
  <div class="top"><div class="logo">L</div><span class="label">Your Logo</span></div>
  <nav>
    <a href="#home" class="active"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10H3z"/></svg><span class="label">Home</span></a>
    <a href="#projects"><svg viewBox="0 0 24 24"><path d="M3 7h18v13H3zM8 7V4h8v3"/></svg><span class="label">Projects</span></a>
    <a href="#messages"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4z"/></svg><span class="label">Messages</span></a>
    <a href="#stats"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span class="label">Analytics</span></a>
    <a href="#settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg><span class="label">Settings</span></a>
  </nav>
</aside>
<main>
  <button id="toggle" aria-expanded="true" aria-controls="sidebar">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    <span id="tl">Close sidebar</span>
  </button>
  <h1 id="title">Home</h1>
  <p>Use the button to open and close the sidebar. On wide screens it shrinks to an icon rail; on phones it slides over the page.</p>
</main>
<script>
const sb=document.getElementById('sidebar'),btn=document.getElementById('toggle'),tl=document.getElementById('tl');
const mobile=()=>matchMedia('(max-width:600px)').matches;
function set(open){
  sb.classList.toggle('closed',!open);
  document.body.classList.toggle('open-m',open&&mobile());
  btn.setAttribute('aria-expanded',open);
  tl.textContent=open?'Close sidebar':'Open sidebar';
}
btn.addEventListener('click',()=>set(sb.classList.contains('closed')));
document.body.addEventListener('click',e=>{if(mobile()&&document.body.classList.contains('open-m')&&!sb.contains(e.target)&&!btn.contains(e.target))set(false)});
document.querySelectorAll('nav a').forEach(a=>a.addEventListener('click',e=>{
  e.preventDefault();
  document.querySelectorAll('nav a').forEach(x=>x.classList.remove('active'));
  a.classList.add('active');
  document.getElementById('title').textContent=a.textContent.trim();
  if(mobile())set(false);
}));
set(!mobile());
</script>
</body>
</html>
