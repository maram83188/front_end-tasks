<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contact Form</title>
<style>
:root{--bg:#f7b500;--card:#fff;--ink:#111;--muted:#555;--line:#111;--err:#b00020;--ok:#0a6b2d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a2000;--card:#111;--ink:#f5efe0;--muted:#b9b095;--line:#f7b500;--err:#ff6b81;--ok:#5ad98a}}
:root[data-theme="dark"]{--bg:#2a2000;--card:#111;--ink:#f5efe0;--muted:#b9b095;--line:#f7b500;--err:#ff6b81;--ok:#5ad98a}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif;display:grid;place-items:center;padding:20px}
.card{width:100%;max-width:560px;background:var(--card);border:3px solid var(--line);border-radius:14px;padding:clamp(20px,5vw,36px)}
h1{font-family:Georgia,serif;font-size:clamp(26px,5vw,34px);margin:0 0 6px}
.sub{margin:0 0 24px;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.full{grid-column:1/-1}
@media (max-width:520px){.grid{grid-template-columns:1fr}}
label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
input,textarea{width:100%;font:inherit;color:var(--ink);background:transparent;border:2px solid var(--line);border-radius:10px;padding:12px 14px}
textarea{min-height:130px;resize:vertical}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid #f7b500;outline-offset:2px}
.invalid{border-color:var(--err)}
.err{color:var(--err);font-size:13px;min-height:18px;margin-top:4px}
button{width:100%;font:700 16px system-ui,sans-serif;background:#111;color:#f7b500;border:2px solid #111;border-radius:10px;padding:14px;cursor:pointer;transition:transform .15s}
button:hover{transform:translateY(-2px)}
#status{margin-top:14px;font-weight:600;color:var(--ok);min-height:22px}
@media (prefers-color-scheme:dark){button{background:#f7b500;color:#111;border-color:#f7b500}}
@media (prefers-reduced-motion:reduce){button{transition:none}}
</style>
</head>
<body>
<div class="card">
  <h1>Get in touch</h1>
  <p class="sub">Send us a message and we’ll reply within two working days.</p>
  <div id="f" class="grid" role="group" aria-label="Contact form">
    <div>
      <label for="name">Full name</label>
      <input id="name" autocomplete="name">
      <div class="err" data-for="name"></div>
    </div>
    <div>
      <label for="email">Email address</label>
      <input id="email" type="email" autocomplete="email" inputmode="email">
      <div class="err" data-for="email"></div>
    </div>
    <div class="full">
      <label for="subject">Subject</label>
      <input id="subject">
      <div class="err" data-for="subject"></div>
    </div>
    <div class="full">
      <label for="message">Message</label>
      <textarea id="message"></textarea>
      <div class="err" data-for="message"></div>
    </div>
    <div class="full">
      <button id="send" type="button">Send message</button>
      <div id="status" role="status" aria-live="polite"></div>
    </div>
  </div>
</div>
<script>
const rules={
  name:v=>v.trim().length<2?'Enter your full name.':'',
  email:v=>!v.trim()?'Enter your email address.':!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim())?'Enter a valid email, like name@example.com.':'',
  subject:v=>!v.trim()?'Enter a subject.':'',
  message:v=>v.trim().length<10?'Write at least 10 characters.':''
};
function check(id){
  const el=document.getElementById(id),msg=rules[id](el.value);
  el.classList.toggle('invalid',!!msg);
  el.setAttribute('aria-invalid',!!msg);
  document.querySelector(`[data-for="${id}"]`).textContent=msg;
  return !msg;
}
Object.keys(rules).forEach(id=>document.getElementById(id).addEventListener('blur',()=>check(id)));
document.getElementById('send').addEventListener('click',()=>{
  const st=document.getElementById('status');
  const ok=Object.keys(rules).map(check).every(Boolean);
  if(!ok){st.textContent='';document.querySelector('.invalid')?.focus();return}
  st.textContent='Message sent. Thank you!';
  Object.keys(rules).forEach(id=>document.getElementById(id).value='');
});
</script>
</body>
</html>
